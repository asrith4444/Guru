[package]
name = "guru"
version = "0.1.0"
edition = "2021"
description = "Guru: a reading-first, practice-driven learning coach that runs on top of the Codex CLI"
license = "Apache-2.0"

[[bin]]
name = "guru"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Guru is meant to be the opposite of a RAM-hungry app: a small, static-ish
# binary that idles at a few MB and only spends memory while Codex is working.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
